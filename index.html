<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vulcanizing Academy</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#30353A"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#EEF0EE;--ink:#1F2428;--road:#30353A;--line:#F0B400;--ok:#2E7D5B;--bad:#B3392B;--mut:#5C656B;--card:#fff;--bd:#D3D8D4}
@media(prefers-color-scheme:dark){:root{--bg:#1B1F22;--ink:#E8EAE8;--road:#101315;--card:#262B2F;--mut:#9AA3A8;--bd:#3A4146}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Trebuchet MS",Verdana,sans-serif}
header{background:var(--road);color:#EEF0EE;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 22px;border-bottom:6px solid var(--line)}
.size{font:700 clamp(30px,9vw,52px)/1 "Arial Narrow","Franklin Gothic Medium",Arial,sans-serif;letter-spacing:.04em;color:#EEF0EE}.size i{font-style:normal;color:var(--line)}
header p{margin:8px 0 0;color:#C5CBC8;max-width:34em}
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 120px)}
#side{width:260px;flex:none;position:sticky;top:0;max-height:100vh;overflow:auto;background:var(--card);border-right:1px solid var(--bd);padding:14px 12px calc(24px + env(safe-area-inset-bottom,0px))}
#side h4{margin:16px 8px 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
#side a{display:block;text-decoration:none;padding:7px 10px;border-radius:8px;font-size:.92rem;line-height:1.3;margin:1px 0}
#side a:hover{background:var(--bg)}#side a.on{background:var(--line);color:#1F2428;font-weight:700}#side a.off{opacity:.5;pointer-events:none}
#menu{display:none}
main{flex:1;min-width:0;width:100%;padding:18px 20px calc(40px + env(safe-area-inset-bottom,0px))}
.grid{display:flex;flex-wrap:wrap;gap:10px}.grid>*{flex:1 1 260px;margin:0!important}
.tbl{overflow-x:auto;margin:8px 0}table{border-collapse:collapse;width:100%;background:var(--card);font-size:.92rem}th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--road);color:#EEF0EE}
button.btn{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.fb{margin-top:6px;font-size:.9rem;color:var(--mut)}
.prog{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:8px 0}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.prog a{margin-right:14px}
.cert{border:6px double var(--line);background:var(--card);text-align:center;padding:36px 20px;margin:16px 0}.cert h1{margin:0 0 8px}.cert .nm{font-size:1.8rem;font-weight:700;margin:14px 0}
@media print{header,#side,#menu,.noprint{display:none!important}body{background:#fff;color:#000}.cert{border-color:#000;background:#fff}}
@media(max-width:760px){.shell{display:block}#menu{display:block;width:100%;font:inherit;font-weight:700;padding:12px 16px;border:0;border-bottom:1px solid var(--bd);background:var(--card);color:var(--ink);text-align:left}
#side{display:none;position:static;width:auto;max-height:none;border-right:0;border-bottom:1px solid var(--bd)}#side.open{display:block}main{padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px))}}
h2{font-size:1.25rem;margin:26px 0 4px}h3{margin:20px 0 6px}.goal{color:var(--mut);margin:0 0 10px}
a{color:inherit}.btn,.row{display:block;text-decoration:none;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.row.road{border-left:6px solid var(--line)}.row.off{opacity:.55}.tag{font-size:.8rem;color:var(--mut);white-space:nowrap}
.quick{background:var(--line);color:#1F2428;border:0;font-weight:700;padding:16px}
:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.back{display:inline-block;margin-bottom:8px}ul{padding-left:1.2rem}li{margin:4px 0}
.q{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}.q button{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--bd);border-radius:8px;padding:10px;margin:6px 0}
.q button.right{border-color:var(--ok);background:rgba(46,125,91,.18)}.q button.wrong{border-color:var(--bad);background:rgba(179,57,43,.18)}
.score{font-weight:700;margin:12px 0}label.k{display:flex;gap:10px;align-items:center;margin:8px 0}
.flow div{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}.flow div:not(:last-child)::after{content:'';}.out{margin:10px 0 14px;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--ok);border-radius:8px}.out ul{margin:6px 0 0;padding-left:20px}
</style></head><body>
<header><div class="size">205/65 R<i>15</i> 94H</div><p id="sub">Vulcanizing Academy. Learn the tyre trade, from the workshop to the roadside.</p></header>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#555d64"/><stop offset="1" stop-color="#2a2f33"/></linearGradient></defs></svg><button id="menu" aria-expanded="false">☰ Menu</button><div class="shell"><nav id="side" aria-label="Lessons"></nav><main id="app"></main></div>
<script src="content.js"></script><script src="questions.js"></script>
<script src="vextra.js"></script>
<script>
const app=document.getElementById('app');let P={};
try{P=JSON.parse(localStorage.getItem('vp')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('vp',JSON.stringify(P))}catch(e){}};
const all=SEMS.flatMap(s=>s.topics);
const certOk=()=>all.every(t=>P[t.id]!=null)&&(P.exfinal||0)>=70;
function setMiss(q,miss){P.miss=P.miss||{};if(miss)P.miss[q]=1;else delete P.miss[q];save()}
function home(){const doneN=all.filter(t=>P[t.id]!=null).length,pct=Math.round(100*doneN/all.length),nm=Object.keys(P.miss||{}).length;
let h=`<a class="btn quick" href="#/quick">Roadside quick guide</a><div class="prog"><b>Your progress: ${doneN} of ${all.length} lessons quizzed</b><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><a href="#/review">Review missed questions (${nm})</a><a href="#/standards">Standards and references</a>${certOk()?'<a href="#/cert"><b>Get your certificate</b></a>':'<span class="tag">Certificate: quiz every lesson and pass the final exam</span>'}</div>`;
SEMS.forEach(s=>{h+=`<h2>Semester ${s.n}: ${s.name}</h2><p class="goal">${s.goal}</p><div class="grid">`;
s.topics.forEach(t=>{const ready=!!t.notes,sc=P[t.id];
h+=`<a class="row ${t.road?'road':''} ${ready?'':'off'}" ${ready?`href="#/t/${t.id}"`:'aria-disabled="true"'}><span>${t.t}</span><span class="tag">${ready?(sc!=null?'✓ Quiz '+sc+'/5':'Open'):'Coming soon'}</span></a>`});h+=`</div>`});
h+=`<h2>Tests and exam</h2><div class="grid">`;[1,2,3].forEach(k=>{h+=`<a class="row" href="#/exam/${k}"><span>Semester ${k} test</span><span class="tag">${P['ex'+k]!=null?'Best '+P['ex'+k]+'%':'Open'}</span></a>`});h+=`<a class="row" href="#/exam/final"><span>Final exam (30 mixed questions)</span><span class="tag">${P.exfinal!=null?'Best '+P.exfinal+'%':'Open'}</span></a></div><p class="goal">Yellow edge: roadside call-out topics. Pass mark is 70%.</p><h2>Your data</h2><p class="goal">Progress is stored on this device only. Export it to back it up or move it to another device.</p><div class="grid"><button class="btn" id="ex">Export progress</button><label class="btn">Import progress<input type="file" id="im" accept=".json" hidden></label></div>`;app.innerHTML=h;
document.getElementById('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(P)],{type:'application/json'}));a.download='vulcanizing-progress.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('im').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(d&&typeof d==='object'){P=Object.assign(P,d);save();side();home()}}catch(err){alert('That file is not a valid progress file.')}})}}
function qcard(q,cb){const d=document.createElement('div');d.className='q';d.innerHTML=`<b>${q.q}</b>`;const fb=document.createElement('div');fb.className='fb';fb.setAttribute('aria-live','polite');
const order=shuffle(q.o.map((_,i)=>i));
order.forEach(j=>{const b=document.createElement('button');b.textContent=q.o[j];b.onclick=()=>{if(d.dataset.d)return;d.dataset.d=1;const bs=d.querySelectorAll('button'),ok=j===q.a;
if(ok){b.className='right';b.textContent='✓ '+q.o[j]}else{b.className='wrong';b.textContent='✗ '+q.o[j];const r=bs[order.indexOf(q.a)];r.className='right';r.textContent='✓ '+q.o[q.a]}
fb.textContent=(ok?'Correct.':'Not quite. The correct answer is: '+q.o[q.a]+'.')+(q.e?' '+q.e:'');setMiss(q.q,!ok);cb(ok)};d.appendChild(b)});d.appendChild(fb);return d}
function lesson(id){const t=all.find(x=>x.id===id);if(!t||!t.notes)return home();
app.innerHTML=`<a class="back" href="#/">Back to lessons</a><h2>${t.t}</h2>${t.o?`<div class="out"><b>By the end of this lesson you can</b><ul>${t.o.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}${t.notes}${t.more||''}<h3>Check your understanding</h3><div id="qz" class="grid"></div><div class="score" id="sc" aria-live="polite"></div>`;let right=0,done=0;
const qs=shuffle(t.quiz).slice(0,5);qs.forEach(q=>document.getElementById('qz').appendChild(qcard(q,ok=>{done++;if(ok)right++;
if(done===qs.length){document.getElementById('sc').textContent=`You scored ${right} out of ${qs.length}.`;P[id]=Math.max(P[id]||0,right);save();side()}})));window.scrollTo(0,0)}
function quick(){let K={};try{K=JSON.parse(localStorage.getItem('vk')||'{}')}catch(e){}
app.innerHTML=`<a class="back" href="#/">Back to lessons</a><h2>Roadside quick guide</h2><p class="goal">Works offline. Tick your kit before you leave.</p><h3>Kit checklist</h3>`+KIT.map((k,i)=>`<label class="k"><input type="checkbox" data-i="${i}" ${K[i]?'checked':''}> ${k}</label>`).join('')+
`<h3>Fix, replace or tow?</h3><div class="flow"><div><b>1. Sidewall cut or bulge, bent rim, or unsafe spot?</b><br>Yes: replace or tow.</div><div><b>2. Hole in the tread, 6 mm or smaller?</b><br>Yes: plug on the spot and advise a full repair. No: replace.</div><div><b>3. Is the spare sound?</b><br>Yes: change the wheel. No: repair the flat or tow.</div></div><h3>On arrival</h3><ul><li>Park safely, switch on hazards, place the triangle well behind.</li><li>Chock the wheels, then loosen the nuts before you jack.</li><li>Look for the damage: nail in the tread (repairable), sidewall cut or bulge (replace or tow).</li></ul><p class="goal">Full call-out lessons are in Semester 2.</p>`;
app.querySelectorAll('input').forEach(c=>c.onchange=()=>{K[c.dataset.i]=c.checked;try{localStorage.setItem('vk',JSON.stringify(K))}catch(e){}})}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function finalPaper(){const seen=new Set(),pick=[];all.forEach(t=>{const q=shuffle(t.quiz||[])[0];if(q&&!seen.has(q.q)){seen.add(q.q);pick.push(q)}});const pool=shuffle([...all.flatMap(t=>t.quiz||[]),...Object.values(EXAMS).flat()]).filter(q=>!seen.has(q.q));return shuffle(pick.concat(pool.slice(0,Math.max(0,30-pick.length))))}
function exam(k){const fin=k==='final';let qs;if(fin){qs=finalPaper()}else qs=EXAMS[k];if(!qs)return home();
app.innerHTML=`<a class="back" href="#/">Back to lessons</a><h2>${fin?'Final exam':'Semester '+k+' test'}</h2><p class="goal">${qs.length} questions. Pass mark 70%.</p><div id="qz" class="grid"></div><div class="score" id="sc" aria-live="polite"></div>`;let right=0,done=0;
qs.forEach(q=>document.getElementById('qz').appendChild(qcard(q,ok=>{done++;if(ok)right++;
if(done===qs.length){const pct=Math.round(100*right/qs.length);const sc=document.getElementById('sc');sc.innerHTML=`You scored ${right} out of ${qs.length} (${pct}%). ${pct>=70?'Passed.':'Not yet. Review the lessons and try again.'} <br><button class="btn" id="rt">Retake</button>`;document.getElementById('rt').onclick=()=>exam(k);P['ex'+k]=Math.max(P['ex'+k]||0,pct);save()}})));window.scrollTo(0,0)}
function review(){const m=P.miss||{},seen=new Set();const qs=[...all.flatMap(t=>t.quiz||[]),...Object.values(EXAMS).flat()].filter(q=>m[q.q]&&!seen.has(q.q)&&seen.add(q.q));
app.innerHTML=`<a class="back" href="#/">Back to lessons</a><h2>Review missed questions</h2>`+(qs.length?`<p class="goal">${qs.length} question(s) you missed. Answer correctly to clear them from the list.</p><div id="qz" class="grid"></div><div class="score" id="sc" aria-live="polite"></div>`:`<p class="goal">Nothing to review. Questions you miss will appear here.</p>`);
if(qs.length){let done=0;qs.forEach(q=>document.getElementById('qz').appendChild(qcard(q,()=>{done++;if(done===qs.length)document.getElementById('sc').textContent='Review complete. Anything you got wrong stays on your list.'})))}window.scrollTo(0,0)}
function cert(){if(!certOk()){app.innerHTML=`<a class="back" href="#/">Back to lessons</a><h2>Certificate</h2><p class="goal">Take the quiz in every lesson and score 70% or more in the final exam to unlock your certificate.</p>`;return}
app.innerHTML=`<a class="back noprint" href="#/">Back to lessons</a><label class="k noprint">Your name <input id="nm" maxlength="60"></label><div class="cert"><h1>Certificate of Completion</h1><p>This certifies that</p><div class="nm" id="cn"></div><p>completed all three semesters of Vulcanizing Academy and passed the final exam with ${P.exfinal}%.</p><p style="font-size:.85rem">This certificate records completion of a self-study course. It is not a government or industry qualification.</p><p>${new Date().toLocaleDateString()}</p></div><button class="btn noprint" onclick="window.print()">Print or save as PDF</button>`;
const i=document.getElementById('nm'),n=document.getElementById('cn');i.value=P.name||'';n.textContent=i.value||'Your name';i.oninput=()=>{P.name=i.value;save();n.textContent=i.value||'Your name'};window.scrollTo(0,0)}
function side(){const h=location.hash||'#/';const L=(href,t,c='')=>`<a href="${href}" class="${c} ${h===href?'on':''}">${t}</a>`;
let s=L('#/','Home')+L('#/quick','Roadside quick guide')+L('#/review','Review missed questions')+L('#/cert','Certificate')+L('#/standards','Standards and references');
SEMS.forEach(m=>{s+=`<h4>Semester ${m.n}: ${m.name}</h4>`+m.topics.map(t=>t.notes?L('#/t/'+t.id,(P[t.id]!=null?'✓ ':'')+t.t):L('#/t/'+t.id,t.t,'off')).join('')});
s+=`<h4>Tests and exam</h4>`+[1,2,3].map(k=>L('#/exam/'+k,'Semester '+k+' test')).join('')+L('#/exam/final','Final exam');
const n=document.getElementById('side');n.innerHTML=s;n.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')}
document.getElementById('menu').onclick=e=>{const o=document.getElementById('side').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)};
function standards(){const S=window.STDS||{note:'',refs:[]};app.innerHTML=`<a class="back" href="#/">Back to lessons</a><h2>Standards and references</h2><div class="out"><p>${S.note}</p></div><div class="grid">${S.refs.map(r=>`<div class="q"><b>${r[0]}</b><br>${r[1]}</div>`).join('')}</div>`;window.scrollTo(0,0)}
function route(){side();const h=location.hash;if(h.startsWith('#/t/'))lesson(h.slice(4));else if(h==='#/quick')quick();else if(h==='#/review')review();else if(h==='#/cert')cert();else if(h==='#/standards')standards();else if(h.startsWith('#/exam/'))exam(h.slice(7));else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
